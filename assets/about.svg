<svg xmlns="http://www.w3.org/2000/svg" width="860" height="338" viewBox="0 0 860 338" role="img" aria-labelledby="title desc"><title id="title">About Lokith</title><desc id="desc">role: Full Stack Developer; focus: Scalable web apps · AI-powered experiences; learning: System Design · Cloud &amp; DevOps · Agentic AI; experience: Building across the stack: thoughtful interfaces, reliable APIs and production-ready integrations.; mission: Make complex workflows feel effortless.; fun_fact: I call it a quick fix. My git history disagrees.</desc>
