<svg xmlns="http://www.w3.org/2000/svg" width="860" height="230" viewBox="0 0 860 230" fill="#e6edf3" role="img" aria-labelledby="title desc">
<title id="title">Lokith — build, learn, repeat</title><desc id="desc">Animated terminal, orbiting commit signals, and a dimensional developer workspace.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101b22"/><stop offset="1" stop-color="#0d1117"/></linearGradient><radialGradient id="glow"><stop stop-color="#3fb950" stop-opacity=".14"/><stop offset="1" stop-color="#3fb950" stop-opacity="0"/></radialGradient><clipPath id="typing"><rect x="566" y="94" width="166" height="19" class="type"/></clipPath></defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
@keyframes type{0%,10%{width:0}45%,90%{width:166px}100%{width:0}}
@keyframes blink{0%,45%{opacity:1}50%,100%{opacity:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes packet{0%{stroke-dashoffset:160}100%{stroke-dashoffset:0}}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
.type{animation:type 7s steps(20,end) infinite}.cursor{animation:blink 1s step-end infinite}
.float{animation:float 5s ease-in-out infinite}.signal{stroke-dasharray:5 155;animation:packet 5s linear infinite}.light{animation:breathe 3s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="860" height="230" rx="16" fill="url(#bg)"/>
<ellipse cx="650" cy="125" rx="230" ry="150" fill="url(#glow)"/>
<path d="M0 207H860M457 0V230" stroke="#25343b" opacity=".35"/>
<circle cx="34" cy="34" r="4" fill="#7ee787" class="light"/><text x="49" y="38" font-size="11" fill="#8b9aae">LOKITH007 / PERSONAL WORKSPACE</text>
<text x="32" y="110" font-size="46" font-weight="700" letter-spacing="-3">Hi, I'm Lokith<tspan fill="#7ee787">.</tspan></text>
<text x="35" y="147" font-size="16" fill="#b8c4ce">Build. Learn. Repeat.</text>
<path d="M35 175H83" stroke="#7ee787" stroke-width="3"/><text x="95" y="179" font-size="10" fill="#8b9aae">SMALL COMMITS. STEADY PROGRESS.</text>
<text x="32" y="222" font-size="9" fill="#62778c">~/lokith007</text><text x="827" y="222" text-anchor="end" font-size="9" fill="#62778c">ideas → code → possibilities</text>
<g class="float">
<path d="M537 171L715 171L778 196L589 196Z" fill="#17272b" stroke="#33494c"/>
<rect x="539" y="47" width="218" height="126" rx="9" fill="#080d12" stroke="#42575c"/>
<path d="M540 70H756" stroke="#263b40"/>
<circle cx="551" cy="59" r="3" fill="#7ee787"/><circle cx="562" cy="59" r="3" fill="#384d51"/><circle cx="573" cy="59" r="3" fill="#384d51"/>
<text x="744" y="62" text-anchor="end" font-size="8" fill="#7b939c">~/workspace</text>
<text x="550" y="108" font-size="12" fill="#7ee787">❯</text><g clip-path="url(#typing)"><text x="566" y="108" font-size="12">git commit -m "grow"</text></g>
<rect x="566" y="120" width="5" height="11" fill="#7ee787" class="cursor"/>
<path d="M580 126H654M550 148H596M604 148H643" stroke="#294239" stroke-width="4" stroke-linecap="round"/>
<path d="M572 181H715M587 186H731" stroke="#41574e" stroke-dasharray="5 4"/>
<path d="M623 192H673" stroke="#7ee787" opacity=".5"/>
</g>
<g fill="none" stroke="#304a3c"><path d="M485 80H522V38H799V150H780"/><path d="M485 80H522V38H799V150H780" stroke="#7ee787" stroke-width="2" class="signal"/><path d="M485 150H511V187H540"/><path d="M485 150H511V187H540" stroke="#7ee787" stroke-width="2" class="signal"/></g>
<g fill="#101c19" stroke="#4b7858"><rect x="470" y="66" width="29" height="29" rx="7"/><rect x="470" y="136" width="29" height="29" rx="7"/><circle cx="799" cy="150" r="12"/></g>
<text x="484" y="85" text-anchor="middle" font-size="13" fill="#7ee787">&lt;/&gt;</text><path d="M478 151H490M484 145V157" stroke="#7ee787"/><path d="M794 150l4 4 7-8" fill="none" stroke="#7ee787" stroke-width="1.5"/>
</svg>
