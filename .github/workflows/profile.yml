name: Refresh animated profile
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'profile-config.json'
      - '.github/workflows/profile.yml'

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch real stats and render animated SVGs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_profile.py
      - name: Save refreshed assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats.svg assets/activity.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh public profile statistics'
          git pull --rebase origin main
          git push origin HEAD:main
